<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المملكة العراقية | الأرشيف والتاريخ</title>
    <!-- استدعاء خط عربي حديث ونظيف (Cairo) لزيادة فخامة الموقع -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- خلفية جمالية تفاعلية -->
    <div class="bg-glow-effect"></div>

    <header class="site-header">
        <div class="header-content">
            <div class="logo-wrapper">
                <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/a/a9/Coat_of_arms_of_the_Kingdom_of_Iraq_%281921%E2%80%931958%29.svg" alt="شعار المملكة العراقية">
            </div>
            <h1>المملكة العراقية</h1>
            <p class="subtitle">أرشيف تاريخي توثيقي</p>
        </div>

        <nav class="nav-container">
            <button id="btn-news" class="nav-btn active">الرئيسية</button>
            <button id="btn-articles" class="nav-btn">المقالات</button>
            <button id="btn-kings" class="nav-btn">ملوك العراق</button>
            <button id="btn-documentaries" class="nav-btn">الوثائقيات</button>
            <button id="btn-photos" class="nav-btn">معرض الصور</button>
            <button id="btn-archive" class="nav-btn">الأرشيف</button>
        </nav>
    </header>

    <main class="main-content">
        <div id="articles-container" class="content-grid">
            <div class="loading-card">
                <div class="spinner"></div>
                <span>جاري تحميل المحتوى التاريخي...</span>
            </div>
        </div>
    </main>

    <!-- حقوق النشر والتصميم -->
    <footer class="site-footer">
        <p>هذا الموقع لا ينتمي إلى جهة أو رسمية، وهو مبادرة تاريخية شخصية.</p>
        <p class="signature">تصميم وبرمجة طه أحمد</p>
    </footer>

    <!-- نافذة تكبير الصور -->
    <div id="imageModal" class="image-modal">
        <span class="close-modal">&times;</span>
        <img id="modalImage" src="" alt="صورة مكبرة">
    </div>

    <script src="script.js"></script>
</body>
</html>
